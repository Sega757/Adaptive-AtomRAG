version: '3.8'

services:
  atomrag-router:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: atomrag_router
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: atomrag_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: atomrag_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always